<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#f59e0b" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Central Badge -->
  <rect x="106" y="106" width="300" height="300" rx="64" fill="url(#amberGrad)" />
  
  <!-- Text 11*2 -->
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="150" font-weight="900" fill="#0f172a" text-anchor="middle" dominant-baseline="middle">
    11•2
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="4">
    ONCE Y DOS
  </text>
</svg>
